name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Static checks and HTTP smoke test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify registries, links and packaging
        run: python3 scripts/verify.py

      - name: Compile Python entry points
        run: python3 -m py_compile start.py scripts/verify.py scripts/smoke.py

      - name: Smoke test the Python launcher
        run: python3 scripts/smoke.py

  node:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Check every ES module
        run: |
          node --check server.mjs
          find public/assets/js scripts -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Smoke test the Node launcher
        run: |
          node server.mjs --port 8099 --no-browser > /tmp/node-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do
            curl -fsS http://127.0.0.1:8099/ > /dev/null 2>&1 && break
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:8099/ > /dev/null
          curl -fsS http://127.0.0.1:8099/assets/js/app.js > /dev/null
          curl -fsS http://127.0.0.1:8099/docs/01-architecture.md > /dev/null
          curl -fsS http://127.0.0.1:8099/version.json > /dev/null
          curl -fsSI http://127.0.0.1:8099/ | grep -qi 'content-security-policy'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS http://127.0.0.1:8099/)" = "200"
          curl -sS -D - -o /dev/null -X OPTIONS http://127.0.0.1:8099/ | grep -qi '^allow:.*OPTIONS'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/missing.js)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/sim/bff-login)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/learn/esxtop-01-mental-model)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/.git/config)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/admin)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/server)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/learners)" = "404"

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: python

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build without pushing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
