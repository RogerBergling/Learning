name: learning-lab

# Automatic in-place updates are intentionally not included.
# Use `docker compose pull` and `docker compose up -d --force-recreate`
# after reviewing the new image and digest.

services:
  learning-lab:
    image: ghcr.io/rogerbergling/learning:latest
    container_name: learning-lab
    mem_limit: 100m
    mem_reservation: 32m
    memswap_limit: 100m      # same as mem_limit = no swap
    ports:
      - "127.0.0.1:8003:8080"
    restart: unless-stopped
    # Pin a reviewed digest in production. Update explicitly with `docker compose pull`.
    pull_policy: if_not_present
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
